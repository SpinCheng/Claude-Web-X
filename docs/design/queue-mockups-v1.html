<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>排队交互设计稿 · claude-remote</title>
<style>
:root {
  --bg: #1D1C1A; --panel: #26241F; --panel2: #2E2B26; --raise: #36332D;
  --ink-hi: rgba(255,255,255,.045);
  --fg: #F2EEE7; --dim: #A79F92; --faint: #6E675D; --line: #36332D;
  --acc: #D97757; --acc-strong: #E8926F; --acc-tint: rgba(217,119,87,.14);
  --ok: #8FB98D; --warn: #D9A262; --err: #DB6B5E;
  --sh-3: 0 -6px 28px rgba(12,10,8,.45);
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --sans: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: #141311; color: var(--fg); font-family: var(--sans); padding: 28px 16px 60px; }
.intro { max-width: 940px; margin: 0 auto 26px; }
.intro h1 { font-size: 19px; font-weight: 600; }
.intro p { color: var(--dim); font-size: 13px; margin-top: 6px; line-height: 1.6; }
.intro .hint { color: var(--acc-strong); font-size: 12.5px; margin-top: 4px; }
.frames { display: flex; flex-wrap: wrap; gap: 26px; justify-content: center; }
.frame-wrap { display: flex; flex-direction: column; gap: 10px; }
.frame-label { text-align: center; }
.frame-label b { font-size: 14px; }
.frame-label span { display: block; color: var(--faint); font-size: 11.5px; margin-top: 2px; line-height: 1.5; }
.frame { position: relative; width: 360px; height: 700px; background: var(--bg); border-radius: 26px; overflow: hidden; box-shadow: 0 18px 60px rgba(0,0,0,.5), inset 0 1px 0 var(--ink-hi); display: flex; flex-direction: column; }

/* 假聊天 + 运行状态 */
.chat-tail { flex: 1; padding: 18px 14px; overflow: hidden; display: flex; flex-direction: column; gap: 12px; justify-content: flex-end; }
.msg-user { align-self: flex-end; max-width: 78%; background: var(--raise); border-radius: 14px 14px 4px 14px; padding: 9px 12px; font-size: 13.5px; line-height: 1.5; }
.msg-bot { align-self: flex-start; max-width: 86%; color: var(--dim); font-size: 13.5px; line-height: 1.6; }
.pill-proc { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; color: var(--faint); font: 10.5px var(--mono); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; }
.pill-proc::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .4; } }
/* 方案三幽灵气泡 */
.ghost { align-self: flex-end; max-width: 78%; border: 1.5px dashed rgba(217,162,98,.55); color: var(--dim); background: rgba(217,162,98,.06); border-radius: 14px 14px 4px 14px; padding: 9px 12px; font-size: 13.5px; line-height: 1.5; cursor: pointer; }
.ghost .tag { display: flex; align-items: center; gap: 5px; font: 10px var(--mono); color: var(--warn); margin-bottom: 5px; }
.ghost .tag::before { content: "⏳"; font-size: 10px; filter: grayscale(1); }

/* dock 通用 */
.dock { position: relative; padding: 8px 12px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 78%, transparent); }
.dock-card { background: var(--panel); border-radius: 18px; box-shadow: var(--sh-3), inset 0 1px 0 var(--ink-hi); }
.dock textarea { width: 100%; border: 0; background: none; color: var(--fg); resize: none; height: 44px; padding: 12px 4px 6px; font: 15px/1.4 var(--sans); outline: none; }
.run-status { display: flex; align-items: center; gap: 8px; padding: 0 8px 7px; font: 10.5px var(--mono); color: var(--warn); letter-spacing: .03em; font-variant-numeric: tabular-nums; }
.lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 8px rgba(217,162,98,.5); animation: breathe 1.6s ease-in-out infinite; flex: none; }

/* 工具栏（无框胶囊 v15 同款，缩略） */
.toolbar { display: flex; align-items: center; gap: 0; padding: 2px 4px 4px; }
.tdot { width: 2px; height: 2px; border-radius: 50%; background: var(--line); margin: 0 4px; flex: none; }
.flat { display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 8px; border: 0; background: none; color: var(--faint); font: 600 11.5px var(--sans); border-radius: 9px; }
.flat .pv { font: 11px var(--mono); font-weight: 400; }
.flat.mode { color: var(--acc-strong); }
.ring-svg { width: 15px; height: 15px; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--raise); stroke-width: 3; }
.ring-fg { fill: none; stroke: var(--acc); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 19.7 56.55; }

/* 发送/停止三态（共享修复：问题1） */
.send, .stopbtn { width: 34px; height: 34px; border-radius: 50%; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
.send { background: var(--acc); color: #fff; box-shadow: 0 2px 10px rgba(217,119,87,.35); }
.send.queue { background: var(--warn); box-shadow: 0 2px 10px rgba(217,162,98,.35); position: relative; }
.send.queue::after { content: ""; position: absolute; top: -2px; right: -2px; width: 10px; height: 10px; border-radius: 50%; background: var(--fg); font: 700 8px var(--mono); }
.stopbtn { background: none; border: 1.5px solid var(--err); color: var(--err); width: 30px; height: 30px; }
.tools-right { margin-left: auto; display: flex; align-items: center; gap: 7px; }

/* 状态切换器 */
.statebar { display: flex; gap: 5px; padding: 0 4px 6px; }
.statebar button { flex: 1; border: 1px solid var(--line); background: none; color: var(--faint); font: 10.5px var(--mono); padding: 5px 2px; border-radius: 7px; cursor: pointer; }
.statebar button.on { border-color: var(--acc); color: var(--acc-strong); }

/* ============ 方案一：徽章 + 气泡 ============ */
.qbadge { display: flex; align-items: center; gap: 8px; margin: 0 2px 6px; padding: 8px 12px; border-radius: 12px; background: rgba(217,162,98,.08); border: 1px solid rgba(217,162,98,.25); color: var(--warn); font-size: 12px; cursor: pointer; }
.qbadge .qn { font: 700 12px var(--mono); }
.qbadge .arrow { margin-left: auto; font: 10px var(--mono); color: var(--faint); }
.pop-bubble { position: absolute; left: 12px; right: 12px; bottom: 128px; background: var(--panel); border-radius: 16px; padding: 14px; box-shadow: var(--sh-3), 0 14px 44px rgba(0,0,0,.55), inset 0 1px 0 var(--ink-hi); z-index: 6; transform-origin: 50% 100%; transform: scaleY(.9) translateY(12px); opacity: 0; pointer-events: none; transition: transform .26s cubic-bezier(.34,1.4,.5,1), opacity .16s; }
.pop-bubble.on { transform: none; opacity: 1; pointer-events: auto; }
.pop-bubble::after { content: ""; position: absolute; bottom: -5px; left: 50%; width: 12px; height: 12px; background: var(--panel); transform: translateX(-50%) rotate(45deg); border-radius: 2px; }
.pop-title { font-size: 13.5px; font-weight: 600; margin-bottom: 4px; }
.qrow { display: flex; align-items: center; gap: 10px; padding: 11px 4px; border-bottom: 1px solid rgba(54,51,45,.5); }
.qrow .idx { font: 600 10.5px var(--mono); color: var(--warn); flex: none; width: 16px; }
.qrow .txt { flex: 1; font-size: 13px; color: var(--fg); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.qrow .del { flex: none; width: 44px; height: 44px; margin: -8px -10px -8px -6px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: var(--faint); cursor: pointer; }
.qrow .del:active { color: var(--err); }
.qfoot { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; }
.qfoot .note { font: 10.5px var(--mono); color: var(--faint); }
.qclear { border: 0; background: none; color: var(--err); font-size: 12px; cursor: pointer; padding: 6px 4px; }
.scrim { position: absolute; inset: 0; background: rgba(10,9,7,.45); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 5; }
.scrim.on { opacity: 1; pointer-events: auto; }

/* ============ 方案二：内联队列条 ============ */
.inline-q { display: flex; flex-direction: column; gap: 5px; margin: 0 2px 6px; }
.iq-item { display: flex; align-items: center; gap: 9px; background: var(--panel2); border-radius: 11px; padding: 9px 6px 9px 12px; box-shadow: inset 0 1px 0 var(--ink-hi); }
.iq-item .idx { font: 600 10px var(--mono); color: var(--warn); flex: none; }
.iq-item .txt { flex: 1; font-size: 12.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iq-item .del { flex: none; width: 40px; height: 40px; margin: -6px -4px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: var(--faint); cursor: pointer; }
.iq-item .del:active { color: var(--err); }
.iq-more { font: 10.5px var(--mono); color: var(--faint); text-align: center; padding: 2px 0; }

/* ============ 方案三在时间线里（见 .ghost），管理气泡复用 pop-bubble ============ */
</style>
</head>
<body>
<div class="intro">
  <h1>排队交互 · 三版设计稿</h1>
  <p>共同修复（问题1）：三态按钮——空闲=发送；运行中+输入空=停止；<b>运行中+有文字=停止(弱化)+发送(琥珀排队态)并排</b>，手机可直接发排队消息。每帧顶部可切换状态预览。差异在队列展示（问题2）：</p>
  <p class="hint">▸ 点各帧的状态按钮切换；方案一点徽章 / 方案三点幽灵气泡 看管理弹层</p>
</div>
<div class="frames" id="frames"></div>

<script>
const ICON = {
  send: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  stop: '<svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M6 6h12v12H6z"/></svg>',
  x: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  shield: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.6-3 8.1-7 10-4-1.9-7-5.4-7-10V6l7-3z"/></svg>',
  chip: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8"/></svg>',
  gauge: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14l4-4"/><path d="M4 19a9 9 0 0 1 16 0"/></svg>',
  ring: '<svg viewBox="0 0 24 24" class="ring-svg"><circle class="ring-bg" cx="12" cy="12" r="9"/><circle class="ring-fg" cx="12" cy="12" r="9"/></svg>',
};
const qTexts = ['跑完后把测试也补上，用 npm test 验证', '顺便更新一下 README 的安装说明'];
const qHTML = (texts) => `
  <div class="pop-title">排队中 · ${texts.length} 条</div>
  ${texts.map((t, i) => `<div class="qrow"><span class="idx">${i + 1}</span><span class="txt">${t}</span><button class="del" title="删除">${ICON.x}</button></div>`).join('')}
  <div class="qfoot"><span class="note">本轮结束后 800ms 自动依序发出</span><button class="qclear">清空队列</button></div>`;

const statebar = `
  <div class="statebar">
    <button data-st="idle">空闲</button>
    <button data-st="running" class="on">运行中</button>
    <button data-st="typing">运行中+输入</button>
  </div>`;

/* dock 内容按状态渲染：右下角三态 */
function toolsRight(st) {
  if (st === 'idle') return `<button class="send" title="发送">${ICON.send}</button>`;
  if (st === 'running') return `<button class="stopbtn" title="停止">${ICON.stop}</button>`;
  return `<button class="stopbtn" title="停止">${ICON.stop}</button><button class="send queue" title="加入排队">${ICON.send}</button>`;
}
function toolbar(st) {
  return `<div class="toolbar">
    <button class="flat mode">${ICON.shield}<span class="pv">自动</span></button><span class="tdot"></span>
    <button class="flat">${ICON.ring}<span class="pv">48%</span></button><span class="tdot"></span>
    <button class="flat">${ICON.chip}<span class="pv">glm-5.3</span></button><span class="tdot"></span>
    <button class="flat">${ICON.gauge}<span class="pv">高</span></button>
    <span class="tools-right">${toolsRight(st)}</span>
  </div>`;
}
function dock(st, extra = '') {
  return `<div class="dock">
    <div class="dock-card">
      ${statebar}
      ${extra}
      <textarea placeholder="${st === 'typing' ? '跑完后把测试也补上，用 npm test 验证' : '提出后续修改要求'}">${st === 'typing' ? '跑完后把测试也补上，用 npm test 验证' : ''}</textarea>
      ${toolbar(st)}
    </div>
  </div>`;
}
const chatRun = `
  <div class="msg-user">修复登录页在手机上的样式问题</div>
  <div class="pill-proc">过程 · 12 步 · 正在调用 Edit</div>
  <div class="msg-bot">正在修改 login.vue 的媒体查询断点，把 768px 以下改为单列布局…</div>`;

const frames = [
  { id: 'Q1', name: '方案一 · 徽章 + 管理气泡', tag: 'dock 上常驻琥珀队列徽章（计数+说明），点击弹 v15 同款锚定气泡：逐条文本+删除+清空。渐进披露、贴现有语言', build(frame) {
      frame.innerHTML = `
        <div class="chat-tail">${chatRun}</div>
        ${dock('running', `<div class="qbadge"><span class="qn">排队 2</span><span>本轮后自动发出</span><span class="arrow">管理 ▸</span></div>`)}
        <div class="scrim"></div>
        <div class="pop-bubble">${qHTML(qTexts)}</div>`;
      const pb = frame.querySelector('.pop-bubble'), sc = frame.querySelector('.scrim');
      // delegation: survives dock rebuilds from the state switcher
      frame.addEventListener('click', (e) => {
        if (e.target.closest('.qbadge')) { pb.classList.add('on'); sc.classList.add('on'); }
        if (e.target === sc || e.target.closest('.qclear') || e.target.closest('.del')) { pb.classList.remove('on'); sc.classList.remove('on'); }
      });
      wireStates(frame, (st) => dock(st, st === 'idle' ? '' : `<div class="qbadge"><span class="qn">排队 2</span><span>本轮后自动发出</span><span class="arrow">管理 ▸</span></div>`));
    } },
  { id: 'Q2', name: '方案二 · 内联队列条', tag: '队列消息直接以小条叠在输入框上方（始终可见、零点击），逐条 × 删除，>2 条折叠 "+N"。所见即所得但占 dock 高度', build(frame) {
      const extra = `<div class="inline-q">
        ${qTexts.map((t, i) => `<div class="iq-item"><span class="idx">${i + 1}</span><span class="txt">${t}</span><button class="del">${ICON.x}</button></div>`).join('')}
        <div class="iq-more">+1 更多 · 运行结束后自动发出</div>
      </div>`;
      frame.innerHTML = `<div class="chat-tail">${chatRun}</div>${dock('running', extra)}`;
      wireStates(frame, (st) => dock(st, extra));
    } },
  { id: 'Q3', name: '方案三 · 时间线幽灵气泡', tag: '排队消息按时间顺序渲染进聊天流（虚线幽灵气泡+⏳排队标签），点击弹管理气泡。队列位置直观可见，与现有转录语言统一', build(frame) {
      frame.innerHTML = `
        <div class="chat-tail">
          <div class="msg-user">修复登录页在手机上的样式问题</div>
          <div class="pill-proc">过程 · 12 步 · 正在调用 Edit</div>
          <div class="msg-bot">正在修改 login.vue 的媒体查询断点…</div>
          <div class="ghost" id="gh1"><span class="tag">排队中 · 第 1 位</span>跑完后把测试也补上，用 npm test 验证</div>
          <div class="ghost" id="gh2"><span class="tag">排队中 · 第 2 位</span>顺便更新一下 README 的安装说明</div>
        </div>
        ${dock('running')}
        <div class="scrim" id="sc3"></div>
        <div class="pop-bubble" id="pb3">${qHTML(qTexts)}</div>`;
      const pb = frame.querySelector('#pb3'), sc = frame.querySelector('#sc3');
      frame.querySelector('#gh1').onclick = () => { pb.classList.add('on'); sc.classList.add('on'); };
      frame.querySelector('#gh2').onclick = () => { pb.classList.add('on'); sc.classList.add('on'); };
      sc.onclick = () => { pb.classList.remove('on'); sc.classList.remove('on'); };
      wireStates(frame, (st) => dock(st));
    } },
];

function wireStates(frame, dockHtml) {
  frame.querySelectorAll('.statebar button').forEach((b) => {
    b.onclick = () => {
      frame.querySelectorAll('.statebar button').forEach((x) => x.classList.remove('on'));
      b.classList.add('on');
      const st = b.dataset.st;
      // replace dock-card content in place (keep chat tail)
      const newDock = document.createElement('div');
      newDock.innerHTML = dockHtml(st);
      frame.querySelector('.dock').replaceWith(newDock.firstElementChild);
      // rewire (rebbuilt nodes)
      frame.querySelectorAll('.statebar button').forEach((nb) => {
        nb.onclick = () => { b.click(); }; // simplest: rewire via original handler by re-entry
      });
      wireStates(frame, dockHtml); // re-bind properly
    };
  });
}

const host = document.getElementById('frames');
for (const f of frames) {
  const wrap = document.createElement('div');
  wrap.className = 'frame-wrap';
  wrap.innerHTML = `<div class="frame" id="f${f.id}"></div>
    <div class="frame-label"><b>${f.name}</b><span>${f.tag}</span></div>`;
  host.appendChild(wrap);
  f.build(wrap.querySelector('.frame'));
}
</script>
</body>
</html>
